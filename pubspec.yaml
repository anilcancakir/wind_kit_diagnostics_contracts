name: wind_kit_diagnostics_contracts
description: "Read wind_kit widget state (className, breakpoint, brightness, states) from debug tools and AI agents without depending on wind_kit. Pure contracts, no UI."
version: 1.3.0
homepage: https://anilcancakir.com/wind_kit_diagnostics_contracts
repository: https://github.com/anilcancakir/wind_kit_diagnostics_contracts
issue_tracker: https://github.com/anilcancakir/wind_kit_diagnostics_contracts/issues

# pub.dev search topics (max 5, lowercase + hyphens, regex ^[a-z][a-z0-9-]{0,31}$).
# Drives tag-based discovery on https://pub.dev/packages?q=topic%3A<topic>.
# Topics other packages already use: debug tooling (diagnostics, debugging,
# devtools), LLM agents (ai-agents) and the Tailwind-style cluster wind_kit
# belongs to (tailwind).
topics:
  - diagnostics
  - debugging
  - devtools
  - ai-agents
  - tailwind

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
