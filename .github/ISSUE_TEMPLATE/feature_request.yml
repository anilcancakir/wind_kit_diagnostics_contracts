name: Feature Request
description: Suggest a new key or an improvement for wind_kit_diagnostics_contracts
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for wind_kit_diagnostics_contracts? Say which widget state or
        counter your tool cannot read today. A new key in a returned map is a minor
        bump; a new method on a contract is a major one, so say what you need and
        we will find the cheaper shape.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see, and why is it needed?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe a real scenario where you would use it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workaround you tried?

  - type: textarea
    id: code
    attributes:
      label: Example Code
      description: How would the API look in practice?
      render: dart
