name: Bug Report
description: Report a bug in wind_kit_diagnostics_contracts
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A bug is easier to fix when it names the contract that
        misbehaved: `WindDebugResolver`, `WindPerfResolver` or `WindDebugRegistry`,
        and whether you implement it (wind_kit, a test fake) or read it (tapir, a
        debug tool).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        For example:
        1. Call `WindDebugRegistry.register(resolver)`
        2. Read `WindDebugRegistry.current?.resolve(element)`
        3. The map is missing the `states` key
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: contract
    attributes:
      label: Contract
      options:
        - WindDebugResolver
        - WindPerfResolver
        - WindDebugRegistry
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Linux
        - Web
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: wind_kit_diagnostics_contracts Version
      placeholder: "1.3.0"
    validations:
      required: true

  - type: textarea
    id: flutter-doctor
    attributes:
      label: flutter doctor -v
      render: shell
